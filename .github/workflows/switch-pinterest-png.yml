name: switch-pinterest-png
on:
  push:
    paths:
      - '.github/trigger-pinterest-png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SVG to PNG in posts
        run: |
          set -eux
          for f in \
            src/content/posts/800-sq-ft-adu-cost-california.md \
            src/content/posts/garage-conversion-adu-cost-california.md \
            src/content/posts/adu-soft-costs-permits-california.md \
            src/content/posts/modular-vs-site-built-adu-cost-california.md \
            src/content/posts/adu-all-in-cost-california.md
          do
            sed -i 's|/images/pinterest/\([^)"'\'' ]*\)\.svg|/images/pinterest/\1.png|g' "$f"
            sed -i 's/^modDatetime: .*/modDatetime: 2026-09-06T00:00:00Z/' "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Switch Pinterest post embeds from SVG to PNG"
          git push
