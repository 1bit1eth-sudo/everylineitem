# Daily production rebuild so scheduled posts go live.
#
# The site is static: src/utils/postFilter.ts leaves out posts whose
# pubDatetime is still in the future at build time, and Workers Builds only
# rebuilds on a push. Posts are scheduled for 01:00 UTC (10:00 KST), so this
# job POSTs the Workers Builds Deploy Hook for `main` at 01:05 UTC every day.
#
# Setup (one time):
#   1. Cloudflare dashboard > Workers & Pages > everylineitem > Settings >
#      Builds > Deploy Hooks: create a hook (name "daily-rebuild", branch
#      "main") and copy the URL.
#   2. GitHub > this repo > Settings > Secrets and variables > Actions >
#      New repository secret: name CLOUDFLARE_DEPLOY_HOOK_URL, value = the URL.
# Scheduled workflows only run from the default branch, so this starts after
# merge. "Run workflow" (workflow_dispatch) triggers a rebuild on demand.
name: Daily rebuild

on:
  schedule:
    - cron: "5 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  trigger-deploy-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST Cloudflare Workers Builds deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret CLOUDFLARE_DEPLOY_HOOK_URL is not set (see setup notes in this file)."
            exit 1
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "$DEPLOY_HOOK_URL")
          echo "HTTP $code"
          head -c 500 response.json; echo
          case "$code" in 2*) ;; *) exit 1 ;; esac
