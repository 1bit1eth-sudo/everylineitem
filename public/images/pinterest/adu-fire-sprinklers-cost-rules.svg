<rect x="60" y="216" width="430" height="170" rx="12" fill="#343f60"/>
<text x="84" y="258" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">R309.2 EXCEPTION</text>
<text x="84" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ff6b01">≤1,200 sq ft</text>
<text x="84" y="358" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">unsprinklered house · same lot</text>
