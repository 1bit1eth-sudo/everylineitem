<text x="534" y="258" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">NFPA 13D COST (AVG)</text>
<text x="534" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ff6b01">$1.61 / sq ft</text>
<text x="534" y="358" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">$0.38–$3.66 range · all-in cost</text>
<text x="60" y="456" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">The two-question test</text>
<text x="60" y="490" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#afb9ca">Answered before you price anything.</text>
<text x="60" y="540" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#afb9ca">SITUATION</text>
<text x="916" y="540" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#afb9ca">SPRINKLERS?</text>
<line x1="60" y1="556" x2="940" y2="556" stroke="#343f60" stroke-width="2"/>
<rect x="60" y="570" width="880" height="104" rx="10" fill="#2d3550"/>
<text x="84" y="618" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Primary home sprinklered</text>
<text x="84" y="652" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">All ADUs, attached or detached</text>
<text x="916" y="630" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">Yes — ADU must match</text>
<rect x="60" y="690" width="880" height="104" rx="10" fill="#283046"/>
<text x="84" y="738" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">New detached ADU</text>
<text x="84" y="772" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Unsprinklered house, ≤1,200 sq ft</text>
<text x="916" y="750" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">No — R309.2 exception</text>
<rect x="60" y="810" width="880" height="104" rx="10" fill="#283046"/>
<text x="84" y="858" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Conversion or JADU</text>
<text x="84" y="892" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Alteration, not new construction</text>
<text x="916" y="870" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">Usually no</text>
<rect x="60" y="930" width="880" height="104" rx="10" fill="#283046"/>
<text x="84" y="978" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">New detached, over 1,200</text>
<text x="84" y="1012" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Any R309.2 condition fails</text>
<text x="916" y="990" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">Yes — new construction</text>
<text x="60" y="1106" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ff6b01">An ADU never forces sprinklers into your house</text>
<text x="60" y="1146" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#eaedf3">Get the C-16 quote early — the water meter moves the number.</text>
<text x="60" y="1226" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Building-code summary, not legal or engineering advice</text>
<text x="60" y="1256" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Confirm with your local fire authority before budgeting</text>
<rect x="0" y="1370" width="1000" height="130" fill="#1a1f2c"/>
