<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
<rect width="1000" height="1500" fill="#212737"/>
<rect width="1000" height="8" fill="#ff6b01"/>
<text x="60" y="96" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Do You Need ADU Insurance?</text>
<text x="60" y="146" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#afb9ca">Three phases, three policies — none in the quote</text>
<line x1="60" y1="186" x2="940" y2="186" stroke="#343f60" stroke-width="2"/>
<rect x="60" y="216" width="430" height="170" rx="12" fill="#343f60"/>
<text x="84" y="258" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">LANDLORD POLICY</text>
<text x="84" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ff6b01">+25%</text>
<text x="84" y="358" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">vs. homeowners, per III estimate</text>
<rect x="510" y="216" width="430" height="170" rx="12" fill="#343f60"/>
<text x="534" y="258" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">COVERAGE B LIMIT</text>
<text x="534" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ff6b01">10%</text>
<text x="534" y="358" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">of dwelling limit for detached ADUs</text>
<text x="60" y="456" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Three phases of ADU insurance</text>
<text x="60" y="490" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#afb9ca">The wrong coverage in any phase costs more than the premium.</text>
<text x="60" y="540" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#afb9ca">PHASE</text>
<text x="916" y="540" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#afb9ca">COVERAGE</text>
<line x1="60" y1="556" x2="940" y2="556" stroke="#343f60" stroke-width="2"/>
<rect x="60" y="570" width="880" height="104" rx="10" fill="#2d3550"/>
<text x="84" y="618.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">During construction</text>
<text x="84" y="652.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Builder's risk — fire, theft, weather</text>
<text x="916" y="630.0" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">1–5% of build cost</text>
<rect x="60" y="690" width="880" height="104" rx="10" fill="#283046"/>
<text x="84" y="738.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Owner-occupied</text>
<text x="84" y="772.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Homeowners endorsement, updated limits</text>
<text x="916" y="750.0" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">Attached: usually covered</text>
<rect x="60" y="810" width="880" height="104" rx="10" fill="#283046"/>
<text x="84" y="858.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Rented out</text>
<text x="84" y="892.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Landlord (DP-3) policy — structure, liability</text>
<text x="916" y="870.0" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">+25% vs. homeowners</text>
<rect x="60" y="930" width="880" height="104" rx="10" fill="#283046"/>
<text x="84" y="978.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Earthquake &amp; flood</text>
<text x="84" y="1012.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Excluded everywhere in California</text>
<text x="916" y="990.0" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">Separate policies</text>
<text x="60" y="1106" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ff6b01">Price all three phases before you break ground.</text>
<text x="60" y="1146" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#eaedf3">The premiums are small; the gaps are where the money hides.</text>
<text x="60" y="1226" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">General information, not insurance advice</text>
<text x="60" y="1256" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Builder's risk 1–5% is an industry-guide range, not a benchmark</text>
<rect x="0" y="1370" width="1000" height="130" fill="#1a1f2c"/>
<line x1="60" y1="1370" x2="940" y2="1370" stroke="#ff6b01" stroke-width="4"/>
<text x="60" y="1412" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ff6b01">Every Line Item</text>
<text x="60" y="1448" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#afb9ca">everylineitem.com</text>
<text x="940" y="1448" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">California ADU Costs · 2026</text>
</svg>
