<text x="60" y="96" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">Your HOA Can't Block Your ADU</text>
<text x="60" y="146" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#afb9ca">Bans are void since 2020 · design rules still apply</text>
<line x1="60" y1="186" x2="940" y2="186" stroke="#343f60" stroke-width="2"/>
<rect x="60" y="216" width="430" height="170" rx="12" fill="#343f60"/>
<text x="84" y="258" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">ADU BAN, PLANNED DEVELOPMENT</text>
<text x="84" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ff6b01">Void</text>
<text x="84" y="358" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">Civil Code 4751 · since 2020</text>
<rect x="510" y="216" width="430" height="170" rx="12" fill="#343f60"/>
<text x="534" y="258" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">CONDO ASSOCIATIONS</text>
<text x="534" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ff6b01">Can still ban</text>
<text x="534" y="358" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">The real exception — condos differ</text>
<text x="60" y="456" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Where the line is</text>
<text x="60" y="490" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#afb9ca">Reasonable rules survive — bans do not.</text>
<text x="60" y="540" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#afb9ca">HOA MOVE</text>
<text x="916" y="540" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#afb9ca" text-anchor="end">STATUS</text>
<line x1="60" y1="556" x2="940" y2="556" stroke="#343f60" stroke-width="2"/>
<rect x="60" y="570" width="880" height="104" rx="10" fill="#2d3550"/>
<text x="84" y="618" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Outright ban</text>
<text x="84" y="652" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Planned development</text>
<text x="916" y="630" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3" text-anchor="end">Void — §4751</text>
<rect x="60" y="690" width="880" height="104" rx="10" fill="#283046"/>
<text x="84" y="738" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Non-CID restriction</text>
<text x="84" y="772" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">No common-area ownership</text>
<text x="916" y="750" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3" text-anchor="end">Void — §714.3</text>
<rect x="60" y="810" width="880" height="104" rx="10" fill="#283046"/>
<text x="84" y="858" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Condo ADU ban</text>
<text x="84" y="892" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Different legal regime</text>
<text x="916" y="870" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3" text-anchor="end">Allowed</text>
<rect x="60" y="930" width="880" height="104" rx="10" fill="#283046"/>
<text x="84" y="978" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Reasonable design rules</text>
<text x="84" y="1012" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Color, style — if cost-neutral</text>
<text x="916" y="990" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3" text-anchor="end">Enforceable</text>
<text x="60" y="1106" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ff6b01">Your HOA can make your ADU look nice.</text>
<text x="60" y="1146" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#eaedf3">It can't make it not exist.</text>
<text x="60" y="1226" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">General information only · not legal advice</text>
<text x="60" y="1256" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">CC&amp;Rs and statutes change — check yours</text>
<rect x="0" y="1370" width="1000" height="130" fill="#1a1f2c"/>
<line x1="60" y1="1370" x2="940" y2="1370" stroke="#ff6b01" stroke-width="4"/>
<text x="60" y="1412" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ff6b01">Every Line Item</text>
<text x="60" y="1448" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#afb9ca">everylineitem.com</text>
<text x="940" y="1448" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca" text-anchor="end">California ADU Costs · 2026</text>
