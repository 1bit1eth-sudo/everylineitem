<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
<rect width="1000" height="1500" fill="#212737"/>
<rect width="1000" height="8" fill="#ff6b01"/>
<text x="60" y="96" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">How to Read an ADU Bid</text>
<text x="60" y="146" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#afb9ca">Four buckets, one honest number</text>
<line x1="60" y1="186" x2="940" y2="186" stroke="#343f60" stroke-width="2"/>
<rect x="60" y="216" width="430" height="170" rx="12" fill="#343f60"/>
<text x="84" y="258" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">DOWN PAYMENT CAP (CA)</text>
<text x="84" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ff6b01">10% or $1,000</text>
<text x="84" y="358" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">whichever is less · B&amp;P §7159</text>
<rect x="510" y="216" width="430" height="170" rx="12" fill="#343f60"/>
<text x="534" y="258" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">CONTINGENCY YOU HOLD</text>
<text x="534" y="318" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ff6b01">10–15%</text>
<text x="534" y="358" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">$32,000–$48,000 on a $320,000 build</text>
<text x="60" y="456" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Sort every line into one bucket</text>
<text x="60" y="490" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#afb9ca">Same drawings, same written scope — then sort.</text>
<text x="60" y="540" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#afb9ca">BUCKET</text>
<text x="916" y="540" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#afb9ca">EXAMPLE</text>
<line x1="60" y1="556" x2="940" y2="556" stroke="#343f60" stroke-width="2"/>
<rect x="60" y="570" width="880" height="104" rx="10" fill="#2d3550"/>
<text x="84" y="618.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Included</text>
<text x="84" y="652.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">In the contract price, contractor’s risk</text>
<text x="916" y="630.0" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">Framing labor, roofing, drywall</text>
<rect x="60" y="690" width="880" height="104" rx="10" fill="#283046"/>
<text x="84" y="738.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Allowance</text>
<text x="84" y="772.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Placeholder budget — you pay the difference</text>
<text x="916" y="750.0" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">“$4,000 appliance allowance”</text>
<rect x="60" y="810" width="880" height="104" rx="10" fill="#283046"/>
<text x="84" y="858.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Excluded</text>
<text x="84" y="892.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Real work, not in this price</text>
<text x="916" y="870.0" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">Utility trenching, permit fees</text>
<rect x="60" y="930" width="880" height="104" rx="10" fill="#283046"/>
<text x="84" y="978.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eaedf3">Owner-paid</text>
<text x="84" y="1012.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Paid directly by you, outside the contract</text>
<text x="916" y="990.0" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" fill="#eaedf3">School district fees</text>
<text x="60" y="1106" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ff6b01">Included + Allowance + Excluded + Owner-paid</text>
<text x="60" y="1146" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#eaedf3">= the comparable total. The headline is only Included.</text>
<text x="60" y="1226" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">A method, not a model · not a quote, not legal advice</text>
<text x="60" y="1256" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">Free blank worksheet at everylineitem.com/worksheet</text>
<rect x="0" y="1370" width="1000" height="130" fill="#1a1f2c"/>
<line x1="60" y1="1370" x2="940" y2="1370" stroke="#ff6b01" stroke-width="4"/>
<text x="60" y="1412" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ff6b01">Every Line Item</text>
<text x="60" y="1448" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" fill="#afb9ca">everylineitem.com</text>
<text x="940" y="1448" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#afb9ca">California ADU Costs · 2026</text>
</svg>
