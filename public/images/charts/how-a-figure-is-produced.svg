<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="t d">
<title id="t">How a cost figure is produced, in five steps</title>
<desc id="d">1. Define the scenario: Size, jurisdiction, build type, site, finish grade; 2. Anchor to permit records: Declared valuations for comparable recent builds; 3. Allocate across six phases: Published phase-level cost shares; 4. Sanity-check per sq ft: Regional benchmarks + small-unit premium; 5. Publish a median: With the variables that move it.</desc>
<rect width="640" height="460" fill="#ffffff"/>
<text x="20" y="30" font-size="21" font-weight="700" fill="#282728">How a figure is produced</text>
<rect x="20" y="44" width="600" height="62" rx="8" fill="#f3f7fa" stroke="#006cac"/>
<circle cx="52" cy="75" r="18" fill="#006cac"/><text x="52" y="81" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
<text x="84" y="71" font-size="18" font-weight="700" fill="#282728">Define the scenario</text>
<text x="84" y="93" font-size="15" fill="#5a5a5a">Size, jurisdiction, build type, site, finish grade</text>
<path d="M52 106 v16" stroke="#006cac" stroke-width="2"/>
<rect x="20" y="122" width="600" height="62" rx="8" fill="#f3f7fa" stroke="#006cac"/>
<circle cx="52" cy="153" r="18" fill="#006cac"/><text x="52" y="159" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
<text x="84" y="149" font-size="18" font-weight="700" fill="#282728">Anchor to permit records</text>
<text x="84" y="171" font-size="15" fill="#5a5a5a">Declared valuations for comparable recent builds</text>
<path d="M52 184 v16" stroke="#006cac" stroke-width="2"/>
<rect x="20" y="200" width="600" height="62" rx="8" fill="#f3f7fa" stroke="#006cac"/>
<circle cx="52" cy="231" r="18" fill="#006cac"/><text x="52" y="237" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
<text x="84" y="227" font-size="18" font-weight="700" fill="#282728">Allocate across six phases</text>
<text x="84" y="249" font-size="15" fill="#5a5a5a">Published phase-level cost shares</text>
<path d="M52 262 v16" stroke="#006cac" stroke-width="2"/>
<rect x="20" y="278" width="600" height="62" rx="8" fill="#f3f7fa" stroke="#006cac"/>
<circle cx="52" cy="309" r="18" fill="#006cac"/><text x="52" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
<text x="84" y="305" font-size="18" font-weight="700" fill="#282728">Sanity-check per sq ft</text>
<text x="84" y="327" font-size="15" fill="#5a5a5a">Regional benchmarks + small-unit premium</text>
<path d="M52 340 v16" stroke="#006cac" stroke-width="2"/>
<rect x="20" y="356" width="600" height="62" rx="8" fill="#f3f7fa" stroke="#006cac"/>
<circle cx="52" cy="387" r="18" fill="#006cac"/><text x="52" y="393" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
<text x="84" y="383" font-size="18" font-weight="700" fill="#282728">Publish a median</text>
<text x="84" y="405" font-size="15" fill="#5a5a5a">With the variables that move it</text>
<text x="20" y="450" font-size="13" fill="#5a5a5a">Diagram: everylineitem.com, CC BY 4.0</text></svg>